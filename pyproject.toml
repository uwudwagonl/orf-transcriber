[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orf-transcriber"
version = "0.1.0"
description = "Download ORF ON videos and produce a Word transcript."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "ORF Transcriber" }]
dependencies = [
    "faster-whisper==1.1.0",
    "python-docx==1.1.2",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
]

[project.gui-scripts]
orf-transcriber = "orf_transcriber.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
